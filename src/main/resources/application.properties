spring.application.name=delivery-api
# Configuração do Servidor
server.port=8080

# Configuração do H2 Database
# spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.url=jdbc:h2:mem:teste
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.datasource.generate-unique-name=false

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.hibernate.ddl-auto=create-drop // USAR QUANDO FOR CONECTAR COM O H2 CONSOLE;
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
# spring.sql.init.mode=always
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de desenvolvimento
# spring.devtools.restart.enabled=true
spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false

# Configurações específicas para JDK 21
# logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================
# SWAGGER / OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=com.deliverytech.delivery_api.controller

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=delivery-tech-secret-key-2026-very-secret-and-secure-key-for-jwt-token-generation
jwt.expiration=86400000

# ============================================
# SECURITY CONFIGURATION
# ============================================
spring.security.user.name=admin
spring.security.user.password=admin
logging.level.org.springframework.security=DEBUG